<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <h1>Recipe Finder</h1>
      <p class="tagline">Search recipes from around the world and save your favorites.</p>

      <form id="search-form" class="search-form">
        <input type="text" id="search-input" placeholder="Search recipes, e.g. chicken">
        <select id="category-select">
          <option value="">All categories</option>
        </select>
        <button type="submit" id="search-btn">Search</button>
      </form>
    </div>
  </header>

  <main class="container">
    <div class="tabs">
      <button type="button" id="tab-results" class="tab-btn active">Results</button>
      <button type="button" id="tab-favorites" class="tab-btn">Favorites</button>
    </div>

    <p id="status" class="status"></p>

    <section id="results" class="grid"></section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button type="button" id="modal-close" class="modal-close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
